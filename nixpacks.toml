[build]
  PYTHON_VERSION = "3.12"

[phases.setup]
  nixPkgs = ["python312", "gcc"]

[phases.install]
  cmds = ["pip install -r requirements.txt"]

[phases.build]
  cmds = [
    "python manage.py collectstatic --noinput",
    "python manage.py migrate --noinput",
    "python -X utf8 seed_data.py"
  ]

[start]
  cmd = "gunicorn smk_lms.wsgi --workers 2 --timeout 120 --log-file -"
